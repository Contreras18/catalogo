<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Variedades C&amp;E</title>
<meta name="description" content="Catálogo de ropa y material eléctrico: paneles LED, tomacorrientes, interruptores y más.">
<style>
:root{--bg:#0f1115;--surface:#1a1d24;--surface-2:#252a36;--text:#f2f3f5;--muted:#9aa0ad;--accent:#f5b301;--on-accent:#14161b;--danger:#ff5d5d;--r:16px;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(15,17,21,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--surface-2)}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.85rem;white-space:nowrap}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 90px;flex:1}
h1{font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;margin-bottom:4px}
h2,h3{line-height:1.25}
.lead{color:var(--muted);margin-bottom:18px}
.crumbs,.back{display:inline-block;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.crumbs a:hover,.back:hover{color:var(--accent)}
.search{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--surface-2);border-radius:999px;padding:12px 18px;margin-bottom:20px}
.search:focus{outline:2px solid var(--accent);border-color:transparent}
.empty{color:var(--muted);padding:24px 0}

.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){.grid{gap:18px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}

.cat{background:linear-gradient(145deg,var(--surface),var(--surface-2));border:1px solid var(--surface-2);border-radius:var(--r);padding:20px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .2s,border-color .2s,box-shadow .2s}
.cat:hover,.cat:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow);outline:none}
.cat .ci{font-size:2rem;line-height:1;margin-bottom:6px}
.cat h2{font-size:1.02rem;letter-spacing:.8px;color:var(--accent)}
.cat p{color:var(--muted);font-size:.86rem}
.cat small{color:var(--muted);font-size:.76rem;opacity:.8}

.card{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:1/1;background:var(--surface-2);display:grid;place-items:center;font-size:2.6rem}
.img[data-zoom]{cursor:zoom-in}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.card.out .img img{opacity:.45}
.badge{position:absolute;top:8px;left:8px;background:var(--danger);color:#fff;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{font-size:.98rem}
.desc{color:var(--muted);font-size:.84rem;flex:1}
.price{font-weight:800;font-size:1.08rem;color:var(--accent);margin-top:2px}

.btn{display:inline-block;text-align:center;background:var(--accent);color:var(--on-accent);border:0;padding:11px 14px;border-radius:12px;font-weight:700;font-size:.92rem;margin-top:8px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger.ghost{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:.84rem;margin-top:0}
.btn.disabled{background:var(--surface-2);color:var(--muted);pointer-events:none}
.btn[disabled]{opacity:.5}

.footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));border-top:1px solid var(--surface-2)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.6rem;box-shadow:var(--shadow);z-index:15}
.fab.hide{display:none}

/* ---------- Carrito y favoritos ---------- */
.tb-actions{display:flex;gap:8px;align-items:center}
.ibtn{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);font-size:1.15rem;line-height:1}
.ibtn.fv{color:#ff4d6d}
.ibtn .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:800;display:grid;place-items:center;font-family:system-ui,sans-serif}
.ibtn .n:empty{display:none}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(15,17,21,.65);font-size:1.25rem;line-height:1;z-index:2;color:#fff}
.heart.on{color:#ff4d6d}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;background:var(--surface-2);border-radius:12px;padding:4px}
.qty button{width:40px;height:36px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:1.15rem}
.qty span{font-weight:800;min-width:28px;text-align:center}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--surface-2)}
.crow:first-child{border-top:0}
.crow .thumb{width:64px;height:64px;font-size:1.8rem}
.cinfo{flex:1;min-width:0}
.cinfo strong{display:block;font-size:.95rem}
.cinfo .sub{color:var(--muted);font-size:.84rem}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.crow .qty{margin-top:0}
.rm{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:4px}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin:4px 0 8px}
.btn.block{display:block;width:100%;padding:14px}
.btn.wa{background:#25d366;color:#07240f}

/* ---------- Admin ---------- */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{font-size:1rem}
.panel p{color:var(--muted);font-size:.9rem;margin:6px 0}
.panel ol{color:var(--muted);font-size:.9rem;margin:8px 0 10px 20px}
.hint{color:var(--muted);font-size:.84rem;margin-top:8px}
.notice{background:rgba(245,179,1,.12);border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:10px 14px;font-size:.9rem;margin:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
.tab{flex:none;background:var(--surface);border:1px solid var(--surface-2);padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.arow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--surface-2)}
.thumb{width:48px;height:48px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-size:1.4rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.ainfo{flex:1;min-width:0;display:flex;flex-direction:column}
.ainfo strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.ainfo span{color:var(--muted);font-size:.82rem}
.amove{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--surface-2);background:var(--surface-2)}
.icon-btn:disabled{opacity:.3}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:.85rem;color:var(--muted)}
.input{background:var(--bg);border:1px solid var(--surface-2);border-radius:12px;padding:12px 14px;width:100%}
.input:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=color].input{padding:4px;height:46px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{margin-top:0;flex:1}
.photo{display:flex;gap:12px;align-items:center}
.pprev{width:96px;height:96px;flex:none;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.78rem;text-align:center}
.pprev img{width:100%;height:100%;object-fit:cover}
.pbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pbtns .btn{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:var(--surface-2);border:0;border-radius:10px;width:42px;height:42px;font-size:1.3rem}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{max-width:520px;border-radius:20px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--surface-2)}
.sheet-head h2{font-size:1.1rem}
.x{background:var(--surface-2);border:0;width:36px;height:36px;border-radius:50%}
.sheet-body{padding:18px;overflow-y:auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:60;display:grid;place-items:center;padding:12px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-2);color:var(--text);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:70;max-width:90vw;text-align:center;font-size:.92rem;border:1px solid var(--accent)}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" href="#/"></a>
  <div class="tb-actions">
    <a class="ibtn fv" href="#/favoritos" aria-label="Mis favoritos">♥<span class="n" id="fav-count"></span></a>
    <a class="ibtn" href="#/carrito" aria-label="Mi carrito">🛒<span class="n" id="cart-count"></span></a>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer class="footer"><span id="footer-text"></span></footer>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">💬</a>
<div id="overlay-root"></div>

</script>

<script>
(function () {
  'use strict';

  /* ================= Utilidades ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const money = (n) => (n > 0 ? new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n) : 'Consultar precio');
  const uid = () => Math.random().toString(36).slice(2, 9);
  const slug = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat';
  const swap = (a, i, j) => { if (i < 0 || j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; };

  const mem = {};
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] == null ? null : mem[k]; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { mem[k] = v; return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} delete mem[k]; }
  };

  function toast(msg) {
    const old = $('.toast'); if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }

  /* ================= Datos ================= */
  const SEED = JSON.parse($('#seed').textContent);
  const SEED_UPDATED = SEED.updated || 0;
  const KEY = 'vce_catalog_v1';
  let data = (function () {
    try {
      const l = JSON.parse(storage.get(KEY) || 'null');
      if (l && l.updated > SEED_UPDATED && l.store && Array.isArray(l.categories)) return l;
    } catch (e) {}
    return JSON.parse(JSON.stringify(SEED));
  })();
  const hasUnpublished = () => data.updated > SEED_UPDATED;
  const findCat = (id) => data.categories.find((c) => c.id === id);

  function commit(msg) {
    data.updated = Math.max(Date.now(), SEED_UPDATED + 1);
    const ok = storage.set(KEY, JSON.stringify(data));
    if (!ok) toast('⚠️ No hay espacio para guardar en este navegador. Descarga el archivo ahora.');
    else if (msg) toast(msg);
    applyStore();
    const y = window.scrollY;
    route(true);
    window.scrollTo(0, y);
  }

  /* ================= Tienda / tema ================= */
  function waNumber() {
    let d = String(data.store.whatsapp || '').replace(/\D/g, '');
    if (d.length === 10 && d[0] === '3') d = '57' + d;
    return d;
  }
  const waUrl = (t) => 'https://wa.me/' + waNumber() + '?text=' + encodeURIComponent(t);
  function onAccent(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#14161b';
    const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14161b' : '#ffffff';
  }
  function applyStore() {
    const s = data.store;
    const root = document.documentElement.style;
    root.setProperty('--accent', s.accent || '#f5b301');
    root.setProperty('--on-accent', onAccent(s.accent));
    $('#brand').textContent = s.name;
    $('#footer-text').textContent = '© ' + new Date().getFullYear() + ' ' + s.name + (s.city ? ' · ' + s.city : '');
    $('#fab').href = waUrl('Hola ' + s.name + ', quiero más información.');
    updateBadges();
  }

  /* ================= Vistas públicas ================= */
  const app = $('#app');

  function productCard(p, c) {
    const out = !!p.soldOut;
    const img = p.image
      ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">'
      : '<span aria-hidden="true">' + esc((c && c.icon) || '📦') + '</span>';
    const fav = cust.favs.indexOf(p.id) > -1;
    const pid = esc(p.id);
    return '<article class="card' + (out ? ' out' : '') + '" data-pid="' + pid + '">' +
      '<div class="img"' + (p.image ? ' data-zoom' : '') + '>' + img + (out ? '<span class="badge">Agotado</span>' : '') +
      '<button class="heart' + (fav ? ' on' : '') + '" data-act="fav" data-p="' + pid + '" aria-pressed="' + fav + '" aria-label="' + (fav ? 'Quitar de favoritos' : 'Guardar en favoritos') + '">' + (fav ? '♥' : '♡') + '</button></div>' +
      '<div class="cb"><h3>' + esc(p.name) + '</h3>' +
      (p.desc ? '<p class="desc">' + esc(p.desc) + '</p>' : '') +
      '<div class="price">' + money(p.price) + '</div>' +
      cartControls(p) +
      '</div></article>';
  }

  function cartControls(p) {
    if (p.soldOut) return '<span class="btn disabled">No disponible</span>';
    const q = cust.cart[p.id] || 0;
    const pid = esc(p.id);
    if (!q) return '<button class="btn" data-act="add" data-p="' + pid + '">🛒 Agregar al carrito</button>';
    return '<div class="qty"><button data-act="dec" data-p="' + pid + '" aria-label="Quitar uno">−</button><span>' + q +
      '</span><button data-act="inc" data-p="' + pid + '" aria-label="Agregar uno">+</button></div>';
  }

  function catCard(c) {
    const n = c.products.length;
    return '<a class="cat" href="#/c/' + encodeURIComponent(c.id) + '"><span class="ci">' + esc(c.icon || '📦') + '</span>' +
      '<h2>' + esc(c.name) + '</h2><p>' + esc(c.subtitle || '') + '</p><small>' + n + ' producto' + (n === 1 ? '' : 's') + '</small></a>';
  }

  function viewHome() {
    document.title = data.store.name;
    app.innerHTML = '<h1>Catálogo</h1><p class="lead">' + esc(data.store.tagline || '') + '</p>' +
      '<input class="search" id="q" type="search" placeholder="Buscar productos…" aria-label="Buscar productos">' +
      '<div id="results"></div>';
    const res = $('#results');
    const draw = (t) => {
      t = norm(t.trim());
      if (!t) {
        res.innerHTML = data.categories.length ? '<div class="grid">' + data.categories.map(catCard).join('') + '</div>' : '<p class="empty">Pronto agregaremos productos.</p>';
        return;
      }
      const items = [];
      data.categories.forEach((c) => c.products.forEach((p) => { if (norm(p.name + ' ' + (p.desc || '')).includes(t)) items.push([p, c]); }));
      res.innerHTML = items.length ? '<div class="grid">' + items.map((i) => productCard(i[0], i[1])).join('') + '</div>' : '<p class="empty">No encontramos productos con esa búsqueda.</p>';
    };
    draw('');
    $('#q').addEventListener('input', (e) => draw(e.target.value));
  }

  function viewCategory(id) {
    const c = findCat(id);
    if (!c) return viewHome();
    document.title = c.name + ' · ' + data.store.name;
    app.innerHTML = '<p class="crumbs"><a href="#/">Catálogo</a> / ' + esc(c.name) + '</p>' +
      '<h1>' + esc(c.icon || '') + ' ' + esc(c.name) + '</h1><p class="lead">' + esc(c.subtitle || '') + '</p>' +
      '<input class="search" id="q" type="search" placeholder="Buscar en ' + esc(c.name.toLowerCase()) + '…" aria-label="Buscar productos">' +
      '<div id="results"></div>';
    const res = $('#results');
    const draw = (t) => {
      t = norm(t.trim());
      const items = c.products.filter((p) => norm(p.name + ' ' + (p.desc || '')).includes(t));
      res.innerHTML = items.length ? '<div class="grid">' + items.map((p) => productCard(p, c)).join('') + '</div>'
        : '<p class="empty">' + (c.products.length ? 'No encontramos productos con esa búsqueda.' : 'Pronto agregaremos productos aquí.') + '</p>';
    };
    draw('');
    $('#q').addEventListener('input', (e) => draw(e.target.value));
  }

  /* ================= Cliente: carrito y favoritos ================= */
  const CKEY = 'vce_customer_v1';
  let cust = (function () {
    try {
      const o = JSON.parse(storage.get(CKEY) || 'null');
      if (o && typeof o === 'object') {
        return { cart: (o.cart && typeof o.cart === 'object') ? o.cart : {}, favs: Array.isArray(o.favs) ? o.favs : [], name: String(o.name || ''), notes: String(o.notes || '') };
      }
    } catch (e) {}
    return { cart: {}, favs: [], name: '', notes: '' };
  })();

  function findProduct(id) {
    for (let i = 0; i < data.categories.length; i++) {
      const c = data.categories[i];
      const p = c.products.find((x) => x.id === id);
      if (p) return { p: p, c: c };
    }
    return null;
  }
  function updateBadges() {
    let n = 0;
    Object.keys(cust.cart).forEach((id) => { if (findProduct(id)) n += cust.cart[id]; });

  function buildOrder() {
    const lines = [];
    let total = 0, unpriced = false;
    Object.keys(cust.cart).forEach((id) => {
      const f = findProduct(id);
      if (!f || f.p.soldOut) return;
      const q = cust.cart[id], p = f.p;
      lines.push('• ' + q + ' x ' + p.name + (p.price > 0 ? ' — ' + money(p.price * q) : ' — precio por confirmar'));
      if (p.price > 0) total += p.price * q; else unpriced = true;
    });
    if (!lines.length) return null;
    let msg = 'Hola ' + data.store.name + ', quiero hacer este pedido:\n\n' + lines.join('\n') + '\n\n';
    msg += total > 0 ? 'Total: ' + money(total) + (unpriced ? ' (más los productos por confirmar)' : '') : 'Total: por confirmar';
    if (cust.name.trim()) msg += '\n\nNombre: ' + cust.name.trim();
    if (cust.notes.trim()) msg += '\nNotas: ' + cust.notes.trim();
    return msg;
  }

  function resizeImage(file, max, q) {
    max = max || 640; q = q || 0.72;
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', q));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

    const pv = (k, d) => (prod && prod[k] != null ? prod[k] : (d == null ? '' : d));

      '<div class="field"><label for="pn">Nombre</label><input class="input" id="pn" required maxlength="80" value="' + esc(pv('name')) + '"></div>' +
      '<div class="field"><label for="pp">Precio en pesos (vacío = "Consultar precio")</label><input class="input" id="pp" inputmode="numeric" placeholder="Ej: 24000" value="' + (pv('price', 0) > 0 ? esc(pv('price')) : '') + '"></div>' +

      '<div class="field"><label for="pc">Categoría</label><select class="input" id="pc">' +
      data.categories.map((c) => '<option value="' + esc(c.id) + '"' + (c.id === cid ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></div>' +
      '<label class="check"><input type="checkbox" id="po"' + (pv('soldOut', false) ? ' checked' : '') + '> Marcar como agotado</label>' +
      '<div class="actions"><button class="btn">Guardar</button>' + (prod ? '<button type="button" class="btn danger" id="pdel">Eliminar</button>' : '') + '</div></form>';

    openSheet(prod ? 'Editar producto' : 'Nuevo producto', html, (root) => {
      const prev = () => { $('#pprev', root).innerHTML = image ? '<img alt="">' : 'Sin foto'; if (image) $('#pprev img', root).src = image; };
      prev();
      $('#pfile', root).addEventListener('change', async (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        try { image = await resizeImage(f); prev(); } catch (err) { toast('No se pudo leer esa imagen. Prueba con otra.'); }

      $('#pf', root).addEventListener('submit', (e) => {
        e.preventDefault();
        const name = $('#pn', root).value.trim();

        const newCid = $('#pc', root).value;

          Object.assign(prod, fields);
          if (newCid !== cid) {
            cat.products = cat.products.filter((x) => x.id !== prod.id);
            findCat(newCid).products.push(prod);
          }
        } else {
          findCat(newCid).products.push(Object.assign({ id: 'p' + uid() }, fields));
        }
        closeSheet();
        commit('Guardado ✅');
      });

  function downloadHtml() {
    const clone = document.documentElement.cloneNode(true);
    ['#app', '#overlay-root', '#brand', '#footer-text', '#fav-count', '#cart-count'].forEach((s) => { const el = clone.querySelector(s); if (el) el.innerHTML = ''; });
    clone.removeAttribute('style');
    const body = clone.querySelector('body'); if (body) body.removeAttribute('class');
    clone.querySelectorAll('.toast').forEach((t) => t.remove());
    const fab = clone.querySelector('#fab'); if (fab) fab.setAttribute('class', 'fab');
    clone.querySelector('#seed').textContent = '\n' + JSON.stringify(data).replace(/</g, '\\u003c') + '\n';
    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Descargando index.html…');
  }

  const actions = {
    tab(c, p, b) { tab = b.dataset.tab; viewAdmin(); },
    logout() { authed = false; location.hash = '#/'; },
    newProd(c) { productSheet(c); },
    editProd(c, p) { productSheet(c, p); },
    moveProd(c, p, b) { const cat = findCat(c); const i = cat.products.findIndex((x) => x.id === p); swap(cat.products, i, i + Number(b.dataset.dir)); commit(); },
    newCat() { categorySheet(); },
    editCat(c) { categorySheet(c); },
    moveCat(c, p, b) { const i = data.categories.findIndex((x) => x.id === c); swap(data.categories, i, i + Number(b.dataset.dir)); commit(); },
    download() { downloadHtml(); },
    fav(c, p) {
      const i = cust.favs.indexOf(p);
      if (i > -1) cust.favs.splice(i, 1); else { cust.favs.push(p); toast('Guardado en favoritos ♥'); }
      saveCust(); refreshAfter(p);
    },
    add(c, p) { cust.cart[p] = 1; saveCust(); toast('Agregado al carrito 🛒'); refreshAfter(p); },
    inc(c, p) { cust.cart[p] = Math.min(99, (cust.cart[p] || 0) + 1); saveCust(); refreshAfter(p); },
    dec(c, p) { const q = (cust.cart[p] || 0) - 1; if (q < 1) delete cust.cart[p]; else cust.cart[p] = q; saveCust(); refreshAfter(p); },
    remove(c, p) { delete cust.cart[p]; saveCust(); refreshAfter(p); },
    clearCart() {
      if (!confirm('¿Vaciar el carrito?')) return;
      cust.cart = {}; saveCust(); refreshAfter();
    },
    sendOrder() {
      const msg = buildOrder();
      if (!msg) return toast('No hay productos disponibles en tu carrito.');
      const w = window.open(waUrl(msg), '_blank');
      if (!w) location.href = waUrl(msg);
      toast('Envía el mensaje en WhatsApp para confirmar tu pedido.');
    },
    reset() {
      if (!confirm('¿Descartar todos los cambios sin publicar?')) return;
      storage.del(KEY);
      data = JSON.parse(JSON.stringify(SEED));
      applyStore();
      route(true);
      toast('Cambios descartados');
    }
  };

      const pin = $('#sp').value.trim();
      if (!name) return toast('Escribe el nombre del negocio.');
      if (wa.replace(/\D/g, '').length < 10) return toast('El número de WhatsApp debe tener al menos 10 dígitos.');
      if (pin && !/^\d{4,8}$/.test(pin)) return toast('El PIN debe tener de 4 a 8 números.');
      Object.assign(data.store, { name: name, tagline: $('#st').value.trim(), city: $('#sc').value.trim(), whatsapp: wa, accent: $('#sa').value });
      if (pin) data.store.pin = pin;
      commit('Guardado ✅');
    }
  });

  /* ================= Rutas ================= */
  function route(keep) {
    const h = location.hash || '#/';
    const m = h.match(/^#\/c\/(.+)$/);
    const isAdmin = h === '#admin' || h === '#/admin';
    const isCart = h === '#/carrito', isFavs = h === '#/favoritos';
    if (isAdmin) viewAdmin();
    else if (isCart) viewCart();
    else if (isFavs) viewFavs();
    else if (m) viewCategory(decodeURIComponent(m[1]));
    else viewHome();
    $('#fab').classList.toggle('hide', isAdmin || isCart);
    if (!keep) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => { closeSheet(); route(); });

  // Acceso secreto al admin: tocar 5 veces el texto del pie de página (o escribir #admin al final de la dirección)
  let taps = 0, tapTimer;
  $('#footer-text').addEventListener('click', () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 3000);
    if (taps >= 5) { taps = 0; location.hash = '#admin'; }
  });

  applyStore();
  route();
})();
</script>
</body>
</html>
